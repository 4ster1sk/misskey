# docker-compose.playwright.yml — #744 Phase 1 PR-1
#
# Playwright e2e 基盤の最小構成。mk-go 単体 + postgres + redis + Playwright
# runner で API/streaming を target に spec を実行する。frontend は本 PR
# では bundle しない (= cypress dropin と同じ API 中心構成、page.goto は
# 後続 PR で frontend bundling を追加するときに導入する)。
#
# 使い方:
#   docker compose -f docker-compose.playwright.yml up -d --build
#   docker compose -f docker-compose.playwright.yml --profile test \
#     run --rm playwright-runner
#   docker compose -f docker-compose.playwright.yml down -v

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20
    networks: [playwright]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [playwright]

  misskey:
    build: ../../
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [playwright]
    volumes:
      - ./files:/misskey/files
      - ./instance.yml:/misskey/.config/default.yml:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/ping || exit 1"
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 45s


  # nginx TLS proxy (#817 part2)。
  # Browser の WebAuthn API は secure context (HTTPS) を要求するため、
  # mk-go (HTTP 3000) の前に nginx を立てて self-signed cert で HTTPS
  # terminate する。Playwright runner は `ignoreHTTPSErrors: true` で
  # cert chain の validation を bypass する。
  # `mkgo.local` alias を nginx に付与して、WebAuthn の RPID 検証も
  # 同時に通す (= `.` を含む hostname、go-webauthn が要求)。
  nginx-tls:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      misskey: {condition: service_healthy}
    networks:
      playwright:
        aliases:
          - misskey.local

  # Playwright runner. profiles: [test] で `up -d` の対象から外し、
  # 明示的に `--profile test run` で起動する (cypress runner と同 pattern)。
  playwright-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      # mkgo backend への接続先。spec から fixtures 経由で参照する。
      # nginx TLS proxy (`mkgo.local` alias) 経由で HTTPS で叩く (#817 part2)。
      # WebAuthn は secure context が必須なため。`ignoreHTTPSErrors` を
      # playwright config 側で立て、self-signed cert を accept する。
      MK_BASE_URL: https://misskey.local
      # Node global WebSocket (streaming spec が使う) は WHATWG 準拠で
      # `rejectUnauthorized` option がない。env で TLS verify を bypass
      # する (= test 環境のみ、self-signed cert を accept する目的)。
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Playwright runner に「TS backend で実行中」と伝える marker。spec 側は
      # process.env.MK_BACKEND_TYPE で TS 限定の skip 等を制御する (#882 で
      # import-zip async download が TS の got HTTPS で self-signed cert を
      # 弾く問題への workaround)。
      MK_BACKEND_TYPE: ts

    volumes:
      # spec ファイルと playwright.config.ts は test 実行時に変更されること
      # があるので bind mount で読み込む。生成物 (test-results/) は host に
      # 残るので gitignore で除外する。
      - ./:/work
      # bind mount が image 焼き付けの /work/node_modules を上書きしないよう
      # anonymous volume で保護する。これにより npm install (Dockerfile.runner)
      # の結果が container 内で生き続ける。
      - /work/node_modules
    working_dir: /work
    depends_on:
      misskey: {condition: service_healthy}
      # nginx-tls は MK_BASE_URL=https://misskey.local の解決先。
      nginx-tls: {condition: service_started}
    networks: [playwright]

networks:
  playwright:
    driver: bridge
