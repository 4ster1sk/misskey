name: Playwright (nightly)

# #744 Phase 1 の Playwright spec を nightly で実行し、drop-in shape drift /
# 連動 endpoint の regression を自動検知する。
#
# - 対象 commit: workflow を trigger した ref (schedule なら本 file が
#   置かれている branch の最新 commit, workflow_dispatch なら inputs.ref
#   または trigger 時の ref) をそのまま checkout し docker build する。
#   develop に固定したい場合は workflow_dispatch から ref=develop を指定
#   すればよい
# - schedule: 毎日 17:00 UTC (≒ JST 02:00)。dropin-e2e (18:00 UTC) /
#   dropin-frontend-e2e (19:00 UTC) と被らせない
# - workflow_dispatch: 任意の ref に対して手動実行可能
# - PR の required check には**入れない**。spec 数が増えれば実行時間が伸び
#   るのと、外部 image pull (TS image) が flaky 要素になる可能性があるため
# - 失敗時は playwright test-results + docker compose logs を artifact 化

on:
  schedule:
    # 毎日 17:00 UTC (= JST 02:00)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to check out (default: trigger ref)"
        required: false

permissions:
  contents: read

jobs:
  spec:
    name: spec (ts)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ref を未指定の場合は actions/checkout のデフォルト挙動に任せ、
      # workflow を trigger した commit (schedule なら本 file が置かれて
      # いる branch HEAD) がそのまま checkout される。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # upstream image を先取りで pull しておく。続く compose up と
      # 並列化するために `&` background 化したい誘惑があるが、GitHub
      # Actions の `run:` step は step 終了で shell が exit するため
      # background process の継続が保証されない (= pre-pull 効果が
      # 不確実)。foreground で完了を待ち、続く compose up 内の同 image
      # pull は docker daemon の cache hit で 0s で済む方が確実。
      # version は docker-compose.playwright.ts.yml と sync。

      - name: Bring up stack
        run: docker compose -f ./tests/playwright/docker-compose.playwright.yml up -d --build

      - name: Run Playwright
        run: docker compose -f ./tests/playwright/docker-compose.playwright.yml --profile test run --rm playwright-runner

      # 失敗時のみ playwright test-results (trace / screenshot 含む) を保存。
      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 失敗時のみ docker compose logs を artifact 化して原因調査できる
      # ようにする。
      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/playwright-logs
          docker compose \
            -f ./tests/playwright/docker-compose.playwright.yml \
            logs > /tmp/playwright-logs/compose.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-logs
          path: /tmp/playwright-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final teardown
        if: always()
        run: docker compose -f ./tests/playwright/docker-compose.playwright.yml down -v >/dev/null 2>&1 || true
